name: Launch lane

# The fast cadence. A meme is judged when its token's first pool appears, not
# twice a day once it may already be trending, so the launch lane runs on its
# own every 30 minutes: new pools, hard gate, anchor verdict, full research on
# anchored ones. No browser, no trending scrape, so a run takes a minute or two.
#
# GitHub's scheduler is best-effort; under load a */30 schedule can slip or
# skip. LAUNCHES_LOOKBACK_HOURS (default 6) is sized so a skipped run or two
# loses nothing. In practice GitHub delivered about one run in eight (Oct
# 2026), so `ops/cron-trigger` fires `repository_dispatch` on time from
# outside; the cron stays as the fallback.
on:
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [launches]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Judge but do not deliver alerts'
        type: boolean
        default: false

# Shared with the full run on purpose: two runs judging the same new pool at
# once would both pay for its anchor check and research.
concurrency:
  group: provenance-run
  cancel-in-progress: false

jobs:
  launches:
    uses: ./.github/workflows/run-lane.yml
    secrets: inherit
    with:
      lane: launches
      dry_run: ${{ inputs.dry_run == true }}
      timeout_minutes: 20
      artifact_prefix: launches-run
      retention_days: 7
