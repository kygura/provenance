name: CI

on:
  # PRs only. A merge to main re-ran the exact checks its PR had just passed,
  # and Actions minutes are kept for the pipeline lanes (docs/cadence.md).
  # Doc-only changes skip CI. Run it by hand with workflow_dispatch.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Test
        run: bun test packages apps
