name: Provenance run

on:
  schedule:
    # Hourly, gated. `cli.ts cadence` decides whether this hour is due from
    # the trailing week of stored runs (apps/worker/src/cadence.ts): at quiet
    # volume only 06:00 and 18:00 UTC are, as before; a hotter meme market
    # tightens it to every 4 h, then every hour. CADENCE_MODE pins a level;
    # auto mode stays at base until LLM_MAX_COST_USD_PER_DAY is set. GitHub's
    # scheduler is best-effort and fires late under load, so the gate also
    # runs an overdue slot. It also stops running on repositories with no
    # activity for 60 days.
    - cron: '0 * * * *'
  # The same hourly tick from `ops/cron-trigger`, which fires on time. It asks
  # the cadence gate exactly like the schedule does.
  repository_dispatch:
    types: [full-run]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Analyse but do not deliver alerts'
        type: boolean
        default: false
      limit:
        description: 'Max tokens to fully analyse this run'
        type: string
        default: ''
      chains:
        description: 'Comma-separated chains (blank = all configured)'
        type: string
        default: ''

# One run at a time: a slow run must never overlap the next scheduled one and
# write interleaved rows for the same token.
concurrency:
  group: provenance-run
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run-lane.yml
    secrets: inherit
    with:
      # A manual dispatch always runs; the hourly ticks ask the gate.
      cadence_gate: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}
      dry_run: ${{ inputs.dry_run == true }}
      limit: ${{ inputs.limit || '' }}
      chains: ${{ inputs.chains || '' }}
      timeout_minutes: 45
      artifact_prefix: provenance-run
      retention_days: 14
