name: Provenance run

# The schedule now runs on the box (ops/box, apps/worker/src/box/scheduler.ts),
# which asks the same cadence gate at 02, 06, 10, 14, 18 and 22 UTC. This
# workflow is for a run by hand, which always runs (no gate).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Analyse but do not deliver alerts'
        type: boolean
        default: false
      limit:
        description: 'Max tokens to fully analyse this run'
        type: string
        default: ''
      chains:
        description: 'Comma-separated chains (blank = all configured)'
        type: string
        default: ''

# One run at a time: a slow run must never overlap the next scheduled one and
# write interleaved rows for the same token.
concurrency:
  group: provenance-run
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run-lane.yml
    secrets: inherit
    with:
      # A manual dispatch always runs; the box asks the gate itself.
      cadence_gate: false
      dry_run: ${{ inputs.dry_run == true }}
      limit: ${{ inputs.limit || '' }}
      chains: ${{ inputs.chains || '' }}
      timeout_minutes: 45
      artifact_prefix: provenance-run
      retention_days: 14
