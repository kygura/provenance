[project]
name = "provenance"
version = "0.1.0"
description = "Scheduled trending-token scraper that has an LLM trace each token's memetic provenance."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
provenance = "provenance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
